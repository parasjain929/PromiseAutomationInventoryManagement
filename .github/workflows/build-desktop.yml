name: Build desktop applications

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name PromiseAutomationInventoryManager --collect-all PySide6 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PromiseAutomation-Windows-x64
          path: dist/PromiseAutomationInventoryManager.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build macOS application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "Promise Automation Inventory Manager" --osx-bundle-identifier com.promiseautomation.inventorymanager --collect-all PySide6 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PromiseAutomation-macOS
          path: dist/Promise Automation Inventory Manager.app
          if-no-files-found: error
